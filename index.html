<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Odliczanie do wakacji</title>
<style>
  body {
    font-family: Arial, sans-serif;
    text-align: center;
    background: #e0e0e0;
    padding: 50px;
  }
  h1 {
    color: #222;
  }
  .vacation-date {
    font-size: 0.9em;
    color: #003366;
    margin-bottom: 20px;
  }
  .countdown {
    font-size: 2em;
    margin: 20px 0;
    color: #000;
  }
  .percentage {
    font-size: 1.5em;
    margin-top: 20px;
    color: #006666;
  }
</style>
</head>
<body>
<!-- nagłówek -->
<h1>Do wakacji pozostało:</h1>
<!-- data wakacji -->
<div class="vacation-date" id="vacationDateText"></div>
<!-- odliczanie czasu -->
<div class="countdown" id="countdown"></div>
<!-- procent pozostałego roku szkolnego -->
<div class="percentage" id="percentage"></div>

<script>
function updateCountdown() {
    const now = new Date();

    //data końca roku szkolnego 26 czerwca 2026
    const vacationDate = new Date(2026, 5, 26, 0, 0, 0); // miesiące od 0, więc 5 = czerwiec

    //wyświetlanie daty wakacji w formacie dd.mm.yyyy
    const day = String(vacationDate.getDate()).padStart(2, '0');
    const month = String(vacationDate.getMonth() + 1).padStart(2, '0'); // miesiące od 0
    const year = vacationDate.getFullYear();
    document.getElementById('vacationDateText').innerText = `Wakacje zaczynają się: ${day}.${month}.${year}`;

    const diff = vacationDate - now;

    const seconds = Math.floor(diff / 1000 % 60);
    const minutes = Math.floor(diff / (1000 * 60) % 60);
    const hours = Math.floor(diff / (1000 * 60 * 60) % 24);
    const days = Math.floor(diff / (1000 * 60 * 60 * 24) % 7);
    const weeks = Math.floor(diff / (1000 * 60 * 60 * 24 * 7));

    document.getElementById('countdown').innerHTML =
        `${weeks} tygodni, ${days} dni, ${hours} godzin, ${minutes} minut, ${seconds} sekund`;

    //procent roku szkolnego (1 września 2025 - 26 czerwca 2026)
    const schoolStart = new Date(2025, 8, 1); // 1 września 2025
    const schoolEnd = vacationDate;
    const totalSchoolTime = schoolEnd - schoolStart;
    let percentLeft = ((schoolEnd - now) / totalSchoolTime) * 100;
    percentLeft = percentLeft < 0 ? 0 : percentLeft.toFixed(2);

    document.getElementById('percentage').innerHTML =
        `Pozostało ${percentLeft}% roku szkolnego`;
}

//aktualizacja co sekundę
setInterval(updateCountdown, 1000);
updateCountdown();
</script>
</body>
</html>
